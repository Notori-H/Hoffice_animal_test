ections": [{"title": "동물의 특징", "paragraphs": ["고양이는 낯선 환경보다,\n자기가 익숙하고 안정감을 느끼는 공간에서 훨씬 편안함을 느낀다고 해요.", "특히:", "방해받지 않는 흐름", "익숙한 루틴", "조용한 집중", "속에서 가장 안정적으로 움직입니다.", "당신도 비슷합니다.", "정신없는 협업 환경보다,\n스스로 몰입할 수 있는 흐름 안에서 훨씬 강점을 발휘하는 타입입니다."]}, {"title": "당신은 이런 사람이에요", "paragraphs": ["당신은 단순히 일을 처리하는 것보다,\n스스로 납득할 수 있는 흐름 안에서 몰입할 때 가장 안정감을 느끼는 타입입니다.", "조용히 집중할 수 있는 환경,\n필요한 자료가 잘 정리되어 있는 상태,\n내가 지금 왜 이 일을 하고 있는지 이해되는 흐름 속에서 강점을 발휘합니다.", "특히 정신없이 흔들리는 환경보다,\n차분하게 정리된 분위기에서 에너지가 올라갑니다."]}, {"title": "회사에서는 이런 순간이 너무 스트레스예요", "paragraphs": ["자료는 분명 존재하는데 아무도 위치를 모르고,\n회의마다 같은 설명을 반복하고,\n메신저·메일·개인폴더를 계속 오가며 파일을 찾는 상황.", "특히:", "정리되지 않은 자료 구조", "끊기는 협업 흐름", "정신없는 파일 탐색", "이 반복될 때 생각보다 훨씬 많은 에너지를 소모하게 됩니다."]}, {"title": "당신에게 문서중앙화는 이런 순간 도움이 될 거예요", "paragraphs": ["당신처럼 안정적인 몰입 흐름이 중요한 사람은,\n자료와 기록이 정리될수록 업무 스트레스가 크게 줄어드는 편입니다.", "문서중앙화 환경에서는:", "업무 히스토리가 자연스럽게 남고", "필요한 자료를 쉽게 다시 찾고", "반복 설명과 탐색 시간이 줄어듭니다.", "이제는 정신없는 자료 탐색보다,\n더 중요한 업무 자체에 집중할 수 있게 됩니다."]}, {"title": "당신에게 추천하는 활용법", "paragraphs": ["✔ 개인 업무 아카이빙하기\n✔ 자주 쓰는 자료 정리하기\n✔ 프로젝트 기록 남기기\n✔ 업무별 저장 위치 고정하기"]}, {"title": "당신을 위한 한 줄", "paragraphs": ["“정리된 환경은 당신의 에너지를 더 중요한 일에 쓰게 만들어줍니다.”"]}], "image": "assets/INFP.png"}, "INFJ": {"mbti": "INFJ", "emoji": "🦉", "name": "부엉이형", "color": "#71645B", "tagline": "흐름과 맥락이 끊기는 순간 가장 답답한 당신", "animalQuote": "부엉이는 어두운 곳에서도 흐름과 움직임을 놓치지 않습니다.", "sections": [{"title": "동물의 특징", "paragraphs": ["부엉이는 작은 움직임과 흐름 변화를 굉장히 민감하게 읽는 동물이라고 해요.", "겉으로는 조용해 보여도,\n주변 상황과 방향을 계속 관찰하며 연결하고 있습니다.", "당신도 비슷합니다.", "눈앞 업무 하나보다:\n“우리가 지금 왜 이걸 하고 있지?”\n라는 맥락과 흐름을 중요하게 생각하는 타입입니다."]}, {"title": "당신은 이런 사람이에요", "paragraphs": ["당신은 단순히 눈앞의 업무 하나보다,\n이 프로젝트가 왜 필요한지,\n지금 조직이 어디로 가고 있는지를 자연스럽게 생각하는 타입입니다.", "흐름과 맥락을 중요하게 보고,\n사람들이 놓치고 있는 연결 지점을 잘 발견하는 편입니다.", "특히 단편적인 업무보다,\n전체 그림이 보이는 환경에서 훨씬 안정감을 느낍니다."]}, {"title": "회사에서는 이런 순간이 너무 스트레스예요", "paragraphs": ["회의는 계속되는데 기록은 남지 않고,\n프로젝트는 반복되는데 이전 히스토리를 아무도 모르고,\n담당자가 바뀌자 업무 맥락이 함께 사라지는 상황.", "“지난번에도 비슷한 거 하지 않았나?”\n싶은 순간이 반복될 때 피로감이 크게 올라갑니다.", "특히:\n회의  줄이고 조직의 효율을 높입니다.”"]}], "image": "assets/INTJ.png"}, "INTP": {"mbti": "INTP", "emoji": "🐙", "name": "문어형", "color": "#D9574F", "tagline": "생각은 연결되는데 자료는 왜 안 연결되지? 싶은 당신", "animalQuote": "문어는 흩어진 정보를 동시에 연결하며 움직입니다.", "sections": [{"title": "동물의 특징", "paragraphs": ["문어는 여러 다리를 따로 움직이는 것 같지만,\n실제로는 주변 정보를 동시에 분석하며 굉장히 복합적으로 행동한다고 해요.", "특히:", "탐색", "연결", "패턴 파악", "능력이 뛰어난 동물입니다.", "당신도 비슷합니다.", "자료 하나보다:\n“이 정보들이 어떻게 연결되지?”\n를 더 중요하게 생각하는 타입입니다."]}, {"title": "당신은 이런 사람이에요", "paragraphs": ["당신은 정보를 연결하고 구조화하는 데 강점을 가진 타입입니다.", "새로운 정보를 보면 자연스럽게 흐름과 구조를 분석하고,\n비효율적인 방식이 보이면 개선 방향을 먼저 떠올리는 편입니다.", "특히:", "검색", "연결", "정보 구조화", "같은 흐름에서 에너지를 얻습니다.", "단순 반복보다는:\n“정보가 어떻게 연결되는가”\n를 중요하게 생각하는 타입입니다."]}, {"title": "회사에서는 이런 순간이 너무 스트레스예요", "paragraphs": ["분명 어딘가에 있는 자료인데 아무도 위치를 모르고,\n같은 파일을 여러 번 요청하고,\n회의 때마다 같은 설명을 반복하는 상황.", "검색은 안 되고,\n폴더는 제각각이고,\n누가 최신본을 갖고 있는지 매번 확인해야 하는 순간:\n“왜 정보가 이렇게 단절돼 있지?”\n라는 생각이 자주 듭니다."]}, {"title": "당신에게 문서중앙화는 이런 순간 도움이 될 거예요", "paragraphs": ["당신처럼 정보 탐색과 연결을 중요하게 생각하는 사람은,\n자료가 체계적으로 연결될수록 업무 효율이 크게 올라갑니다.", "문서중앙화 환경에서는:", "검색 중심으로 자료를 찾고", "링크 기반으로 정보를 연결하고", "프로젝트별 히스토리가 자연스럽게 축적됩니다.", "이제는 자료 위치 찾기보다,\n정보 자체를 더 잘 활용하는 데 집중할 수 있게 됩니다."]}, {"title": "당신에게 추천하는 활용법", "paragraphs": ["✔ 검색 중심 자료 관리하기\n✔ 링크 기반 자료 연결하기\n✔ 프로젝트별 정보 아카이빙하기\n✔ 반복 요청 자료 공용화하기"]}, {"title": "당신을 위한 한 줄", "paragraphs": ["“정보는 저장될 때보다 연결될 때 더 큰 가치를 가집니다.”"]}], "image": "assets/INTP.png"}, "ESFP": {"mbti": "ESFP", "emoji": "🦦", "name": "수달형", "color": "#34A47A", "tagline": "혼자보다 같이 떠들 때 더 살아나는 당신", "animalQuote": "수달은 혼자보다 함께 놀 때 훨씬 더 활발해집니다.", "sections": [{"title": "동물의 특징", "paragraphs": ["수달은 혼자 있는 시간보다,\n무리 안에서 서로 장난치고 반응하며 움직일 때 훨씬 활발해지는 동물이라고 해요.", "실제로:", "돌멩이를 주고받으며 놀고", "같이 움직이며 사냥하고", "서로의 반응에 굉장히 민감하게 반응합니다.", "특히 분위기와 텐션이 살아날수록\n더 에너지가 올라가는 편입니다.", "당신도 비슷합니다.", "혼자 조용히 일하는 것보다,\n사람들과 실시간으로 반응하고,\n함께 움직이는 흐름 속에서 훨씬 몰입하는 타입입니다."]}, {"title": "당신은 이런 사람이에요", "paragraphs": ["당신은 사람들과 함께 움직일 때 가장 에너지가 올라가는 타입입니다.", "혼자 조용히 자료를 정리하는 것보다,\n실시간으로 반응하고,\n웃고 떠들고,\n빠르게 분위기가 살아나는 협업 환경에서 훨씬 몰입하게 됩니다.", "특히:", "현장감 있는 협업", "빠른 리액션", "사람들과의 즉각적인 소통", "속에서 강점을 발휘합니다.", "반대로:\n딱딱하고 반응 없는 분위기,\n혼자 끊겨 있는 업무 흐름에서는 금방 에너지가 떨어지는 편입니다."]}, {"title": "회사에서는 이런 순간이 너무 스트레스예요", "paragraphs": ["회의는 끝났는데 자료는 안 올라오고,\n누군가는 메일 보고 있고,\n누군가는 메신저 파일 보고 있고,\n누군가는 “그거 아직 못 받았는데요?” 하고 있는 상황.", "특히:", "반응 없는 협업", "끊기는 공유 흐름", "답답한 커뮤니케이션", "이 반복될 때:\n“왜 이렇게 일 분위기가 끊기지?”\n라는 답답함을 크게 느끼는 타입입니다.", "그리고 뭔가 다 같이 움직여야 하는 순간인데,\n자료 공유 때문에 템포가 끊기는 걸 특히 싫어합니다."]}, {"title": "당신에게 문서중앙화는 이런 순간 도움이 될 거예요", "paragraphs": ["당신처럼 협업 분위기와 연결감을 중요하게 생각하는 사람은,\n정보 공유 흐름이 자연스러워질수록 훨씬 즐겁게 일할 수 있습니다.", "문서중앙화 환경에서는:", "회의자료를 링크로 바로 공유하고", "실시간으로 같이 수정하고", "프로젝트별 자료가 함께 연결됩니다.", "이제는:\n“누가 파일 다시 보내주세요”\n보다,\n바로 이어서 이야기하고 움직이는 흐름에 더 집중할 수 있게 됩니다."]}, {"title": "당신에게 추천하는 활용법", "paragraphs": ["✔ Teams 기반 협업 적극 활용하기\n✔ 공동편집으로 실시간 수정하기\n✔ 회의자료 링크 공유하기\n✔ 프로젝트별 공용폴더 함께 운영하기"]}, {"title": "당신을 위한 한 줄", "paragraphs": ["“좋은 분위기는 일의 속도까지 바꿉니다.”"]}], "image": "assets/ESFP.png"}, "ESTP": {"mbti": "ESTP", "emoji": "🐆", "name": "치타형", "color": "#E6A526", "tagline": "답답한 절차보다 바로 움직이는 게 좋은 당신", "animalQuote": "치타는 오래 고민하지 않고 가장 빠른 타이밍에 움직입니다.", "sections": [{"title": "동물의 특징", "paragraphs": ["치타는 사냥할 때 완벽한 계획을 오래 세우기보다,\n지금 가장 빠르게 움직일 수 있는 순간을 포착해 폭발적으로 달리는 동물이라고 해요.", "특히:", "속도", "순간 판단", "즉각적인 실행", "능력이 굉장히 뛰어납니다.", "반대로 흐름이 끊기거나,\n움직일 타이밍을 놓치는 상황엔 굉장히 민감합니다.", "당신도 비슷합니다.", "자료 기다리고,\n승인 기다리고,\n공유 기다리는 시간보다:\n“일단 움직이면 되잖아?”\n가 먼저 떠오르는 타입입니다."]}, {"title": "당신은 이런 사람이에요", "paragraphs": ["당신은 오래 고민하는 것보다,\n일단 움직이고 결과를 보면서 방향을 잡는 타입입니다.", "속도가 붙은 환경에서는 누구보다 강한 추진력을 보여주고,\n문제가 생겨도 현장에서 바로 해결해나가는 편입니다.", "특히:", "빠른 실행", "즉각적인 대응", "현실적인 해결", "같은 흐름에서 강점을 발휘합니다.", "반대로:\n느린 의사결정,\n답답한 승인 구조,\n자료 기다리는 시간에는 금방 스트레스를 받는 편입니다."]}, {"title": "회사에서는 이런 순간이 너무 스트레스예요", "paragraphs": ["급하게 자료가 필요한데 누가 갖고 있는지 모르고,\n외근 중인데 회사 자료 접근이 안 되고,\n파일 하나 받기 위해 메신저·메일·전화까지 다 거쳐야 하고,\n회의 끝났는데 정작 공유가 안 돼 다시 연락 돌려야 하는 상황.", "특히 실행해야 하는 타이밍에 정보가 늦게 도착하면:\n“지금 바로 움직이면 되는데…”\n싶은 마음이 계속 쌓입니다.", "자료 찾느라 속도가 끊기는 순간, async function saveResult(type) {
  if (resultSaved) {
    return;
  }

  const result = DATA.results[type];

  if (!result) {
    console.error("저장할 결과 정보를 찾지 못했습니다:", type);
    return;
  }

  try {
    const response = await fetch(
      SUPABASE_URL + "/rest/v1/responses",
      {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY,
          "Content-Type": "application/json",
          "Prefer": "return=minimal"
        },
        body: JSON.stringify({
          mbti: type,
          animal: result.name
        })
      }
    );

    if (!response.ok) {
      const errorText = await response.text();
      throw new Error(
        "저장 실패: " + response.status + " / " + errorText
      );
    }

    resultSaved = true;
    console.log("익명 결과가 저장되었습니다:", type);

  } catch (error) {
    console.error("결과 저장 중 오류:", error);

function finish() {
  const scores = {
    E: 0,
    I: 0,
    N: 0,
    S: 0,
    T: 0,
    F: 0,
    J: 0,
    P: 0
  };

  DATA.questions.forEach((q, i) => {
    const scoreKey = answers[i] === "a" ? q.av : q.bv;
    scores[scoreKey]++;
  });

  const tie = {
    EI: answers[3] === "a" ? "E" : "I",
    NS: answers[7] === "a" ? "N" : "S",
    TF: answers[11] === "a" ? "F" : "T",
    JP: answers[15] === "a" ? "P" : "J"
  };

  const pick = (x, y, axis) => {
    if (scores[x] === scores[y]) {
      return tie[axis];
    }

    return scores[x] > scores[y] ? x : y;
  };

  const type =
    pick("E", "I", "EI") +
    pick("N", "S", "NS") +
    pick("T", "F", "TF") +
    pick("J", "P", "JP");

  renderResult(type, scores);
  show("result");
  saveResult(type);
}
